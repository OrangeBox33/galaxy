<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Возможные друзья — стенд</title><style>
:root {
	color-scheme: dark;
	--sky-top: #04060e;
	--sky-mid: #0a0e1c;
	--sky-bottom: #060811;
	--text: #e9f0ff;
	--text-dim: rgba(233, 240, 255, 0.55);
	--panel: rgba(10, 14, 28, 0.86);
	--panel-edge: rgba(200, 216, 255, 0.14);
	--accent: #c8d8ff;
	--danger: #ff8fa0;
}
*{box-sizing:border-box}
body{margin:0;background:#0b0b0f;color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.phone{position:relative;width:390px;height:560px;margin:24px auto;border:1px solid #223;border-radius:24px;overflow:hidden;
background:radial-gradient(1200px 600px at 30% 120%,#10192e,#04060e 70%)}
.avatar--letter{display:flex;align-items:center;justify-content:center;color:#0a0e1c;font-weight:600}
.bar{position:fixed;left:16px;top:16px;display:flex;gap:8px;align-items:center}
.bar button{border:1px solid var(--panel-edge);background:var(--panel);border-radius:999px;padding:7px 14px;cursor:pointer;color:inherit}
.bar span{color:var(--text-dim);font-size:12.5px}
.me{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;
background:radial-gradient(circle,#fff,rgba(200,224,255,.5) 45%,rgba(160,200,255,0) 72%)}
/* ── Возможные друзья ──────────────────────────────────────────────────
   Стопка карточек в правом верхнем углу. Слот отвечает за место в стопке
   (и плавно подтягивает нижние вверх, когда ушла верхняя), содержимое —
   за прилёт и уход. Шаг стопки 72px = высота карточки плюс зазор; то же
   число лежит в Suggestions.tsx, разъезжаться им нельзя.

   Ширина держится в обещанных 40% экрана, поэтому отступы внутри тесные:
   иначе «Связать» и «Нет» не помещаются в строку и правый край обрезается. */
.suggest {
	position: absolute;
	top: max(12px, env(safe-area-inset-top));
	right: 8px;
	width: min(40vw, 230px);
	min-width: 150px;
	/* Карточки ловят нажатия сами; всё, что между ними, остаётся небом. */
	pointer-events: none;
}

.suggest__slot {
	position: absolute;
	top: 0;
	left: 0;
	right: 0;
	transition: transform 260ms cubic-bezier(0.22, 0.61, 0.36, 1);
	pointer-events: auto;
}

.suggest__slot--leaving {
	pointer-events: none;
}

.suggest__item {
	position: relative;
	display: flex;
	align-items: center;
	gap: 6px;
	height: 64px;
	padding: 0 7px;
	box-sizing: border-box;
	border: 1px solid var(--panel-edge);
	border-radius: 13px;
	background: var(--panel);
	backdrop-filter: blur(12px);
	box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
	overflow: hidden;
	animation: suggest-in 450ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
}

.suggest__body {
	min-width: 0;
	flex: 1;
}

.suggest__name {
	font-size: 13px;
	font-weight: 500;
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
}

.suggest__actions {
	display: flex;
	gap: 5px;
	margin-top: 4px;
}

.suggest__btn {
	border: 1px solid transparent;
	border-radius: 8px;
	padding: 4px 6px;
	font-size: 11px;
	line-height: 1.1;
	white-space: nowrap;
	background: rgba(200, 216, 255, 0.16);
	color: inherit;
	font-family: inherit;
	cursor: pointer;
}

.suggest__btn:hover {
	background: rgba(200, 216, 255, 0.24);
}

.suggest__btn--ghost {
	background: none;
	border-color: var(--panel-edge);
	color: var(--text-dim);
}

/* Прилёт снизу — проявление из темноты: альфа с нуля, ничего не вспыхивает. */
@keyframes suggest-in {
	from {
		opacity: 0;
		transform: translateY(26px);
	}
	to {
		opacity: 1;
		transform: translateY(0);
	}
}

/* «Нет»: карточка просто гаснет. */
.suggest__item--fade {
	animation: suggest-fade 340ms ease forwards;
}

@keyframes suggest-fade {
	from {
		opacity: 1;
	}
	to {
		opacity: 0;
	}
}

/* «Связать»: карточка делает вдох, белеет и схлопывается в точку у нажатой
   кнопки. Круга-вспышки больше нет — он накрывал карточку за 80 мс и читался
   как мгновенная заливка, а не как взрыв. Точка продолжает жить искрой
   (.suggest__seed) и улетает к звезде человека на карте. */
.suggest__item--burst {
	transform-origin: var(--fx, 50%) var(--fy, 50%);
	animation: suggest-collapse 360ms cubic-bezier(0.3, 0.9, 0.6, 1) forwards;
}

@keyframes suggest-collapse {
	0% {
		opacity: 1;
	}
	14% {
		transform: scale(1.035);
	}
	30% {
		background: rgba(255, 255, 255, 0.92);
		border-color: #ffffff;
	}
	66% {
		transform: scale(0.04);
		opacity: 1;
	}
	100% {
		transform: scale(0.04);
		opacity: 0;
	}
}

/* Искра живёт в body: у карточки overflow: hidden, а лететь ей через полэкрана.
   Движение задаётся из Suggestions.tsx — цель известна только в рантайме. */
.suggest__seed {
	position: fixed;
	z-index: 20;
	width: 11px;
	height: 11px;
	margin: -5.5px 0 0 -5.5px;
	border-radius: 50%;
	background: #ffffff;
	box-shadow:
		0 0 16px 5px rgba(214, 232, 255, 0.95),
		0 0 40px 12px rgba(140, 180, 255, 0.35);
	pointer-events: none;
}

/* Движение выключено — карточки появляются и исчезают мгновенно. */
@media (prefers-reduced-motion: reduce) {
	.suggest__slot {
		transition: none;
	}
	.suggest__slot--leaving {
		display: none;
	}
	.suggest__item,
	.suggest__item--fade,
	.suggest__item--burst {
		animation: none;
	}
}

</style></head><body>
<div class="bar">
  <button id="replay">Показать заново</button>
  <button id="where">Звезда: в центре</button>
  <span id="size"></span>
</div>
<div class="phone" id="phone"><div class="suggest" id="stack"></div></div>
<script>
const PEOPLE=[['Марина Ковалёва','#FF8FC0','М'],['Илья','#6FA8FF','И'],['Саша Петров','#C8D8FF','С'],
['Дмитрий Орлов','#C8D8FF','Д'],['Аня','#FF8FC0','А'],['Константин','#6FA8FF','К'],['Женя','#FF8FC0','Ж']];
// Те же числа, что в Suggestions.tsx.
const STEP=72, BURST=360, SEED_AT=.62, FLIGHT=320, FADE=340, EDGE=26;
let rows=[],next=0,offscreen=false;
const stack=document.getElementById('stack'), phone=document.getElementById('phone');

const me=document.createElement('div'); me.className='me'; phone.appendChild(me);
function meAt(){
  const b=phone.getBoundingClientRect();
  return offscreen ? {x:b.left-160,y:b.top+b.height*1.2} : {x:b.left+b.width*.38,y:b.top+b.height*.62};
}
function drawMe(){
  const b=phone.getBoundingClientRect(), p=meAt();
  me.style.display=offscreen?'none':'block';
  me.style.left=(p.x-b.left)+'px'; me.style.top=(p.y-b.top)+'px';
}
document.getElementById('where').onclick=e=>{
  offscreen=!offscreen; drawMe();
  e.target.textContent=offscreen?'Звезда: за экраном':'Звезда: в центре';
};

// Точная копия flySpark из Suggestions.tsx.
function flySpark(from,to){
  let endX=to.x,endY=to.y;
  const inside=to.x>=EDGE&&to.y>=EDGE&&to.x<=window.innerWidth-EDGE&&to.y<=window.innerHeight-EDGE;
  if(!inside){
    const dx=to.x-from.x, dy=to.y-from.y; let k=1;
    if(dx!==0) k=Math.min(k,Math.max((EDGE-from.x)/dx,(window.innerWidth-EDGE-from.x)/dx));
    if(dy!==0) k=Math.min(k,Math.max((EDGE-from.y)/dy,(window.innerHeight-EDGE-from.y)/dy));
    k=Math.max(.15,Math.min(1,k)); endX=from.x+dx*k; endY=from.y+dy*k;
  }
  const seed=document.createElement('div'); seed.className='suggest__seed';
  seed.style.left=from.x+'px'; seed.style.top=from.y+'px'; document.body.appendChild(seed);
  const dx=endX-from.x, dy=endY-from.y;
  const a=seed.animate([
    {transform:'translate(0px,0px) scale(0.35)',opacity:.9},
    {transform:`translate(${dx*.45}px,${dy*.45}px) scale(1)`,opacity:1,offset:.3},
    {transform:`translate(${dx}px,${dy}px) scale(${inside?0.22:0.5})`,opacity:0}],
    {duration:FLIGHT,easing:'cubic-bezier(0.35,0,0.25,1)',fill:'forwards'});
  a.addEventListener('finish',()=>seed.remove());
  if(inside) setTimeout(()=>me.animate([{transform:'scale(1)'},{transform:'scale(2.6)',offset:.3},{transform:'scale(1)'}],
    {duration:420,easing:'ease-out'}),FLIGHT-70);
}

function card(i){
  const [name,tint,letter]=PEOPLE[i%PEOPLE.length];
  const slot=document.createElement('div'); slot.className='suggest__slot';
  slot.innerHTML=`<div class="suggest__item">
    <div class="avatar avatar--letter" style="width:30px;height:30px;border-radius:15px;background:${tint};font-size:13px">${letter}</div>
    <div class="suggest__body"><div class="suggest__name">${name}</div>
    <div class="suggest__actions"><button class="suggest__btn" data-go="burst">Связать</button>
    <button class="suggest__btn suggest__btn--ghost" data-go="fade">Нет</button></div></div></div>`;
  slot.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>leave(slot,b));
  return slot;
}
function place(){ rows.forEach((s,i)=>s.style.transform=`translateY(${i*STEP}px)`); }
function leave(slot,button){
  const item=slot.firstElementChild, box=item.getBoundingClientRect(), br=button.getBoundingClientRect();
  const at={x:br.left+br.width/2,y:br.top+br.height/2};
  item.style.setProperty('--fx',(at.x-box.left)+'px');
  item.style.setProperty('--fy',(at.y-box.top)+'px');
  const mode=button.dataset.go;
  item.classList.add('suggest__item--'+mode);
  slot.classList.add('suggest__slot--leaving');
  slot.querySelectorAll('button').forEach(b=>b.disabled=true);
  if(mode==='burst') setTimeout(()=>flySpark(at,meAt()),BURST*SEED_AT);
  setTimeout(()=>{ rows=rows.filter(s=>s!==slot); slot.remove(); place(); add(); }, mode==='burst'?BURST:FADE);
}
function add(){ if(rows.length>=3)return; const s=card(next++); stack.appendChild(s); rows.push(s); place(); }
function reset(){ stack.innerHTML=''; rows=[]; next=0; add();add();add(); drawMe();
  const w=stack.getBoundingClientRect().width, row=stack.querySelector('.suggest__actions');
  document.getElementById('size').textContent=
    `карточка ${Math.round(w)}px из 390px (${Math.round(w/3.9)}%), кнопкам нужно ${Math.round(row.scrollWidth)}px из ${Math.round(row.clientWidth)}px`;
}
document.getElementById('replay').onclick=reset; reset();
</script></body></html>
