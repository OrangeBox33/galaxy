# Ставится в /etc/nginx/snippets/nikitosfrolov/galaxy.conf. Сайт nikitosfrolov.ru
# подключает всю папку строкой include snippets/nikitosfrolov/*.conf;
# Рядом нужны nginx.galaxy-http.conf и nginx.galaxy-proxy.conf — пути в их шапках.
# Все три ставит ./deploy.sh --nginx.
# Упор в любой лимит Node читает из error.log и шлёт админу (lib/nginxLimits.ts).

location /galaxy/ {
    include snippets/galaxy-proxy.conf;
    # Первый вход тянет разом аватарки всего неба.
    limit_req zone=galaxy_static burst=300 nodelay;
}

location /galaxy/api/ {
    include snippets/galaxy-proxy.conf;
    limit_req  zone=galaxy_api burst=30 nodelay;
    limit_conn galaxy_conn 20;
}

location = /galaxy/api/auth/telegram {
    include snippets/galaxy-proxy.conf;
    limit_req  zone=galaxy_auth   burst=5 nodelay;
    limit_req  zone=galaxy_auth30 burst=5 nodelay;
    limit_conn galaxy_conn 20;
}

# Без лимитов и фильтра по адресам: вебхук закрыт секретом в пути, а свои
# подсети Telegram прямо обещает менять — фильтр однажды молча съел бы /start.
location /galaxy/tg/ {
    include snippets/galaxy-proxy.conf;
}

# Вход без слеша: /galaxy -> /galaxy/
location = /galaxy {
    return 301 /galaxy/;
}
