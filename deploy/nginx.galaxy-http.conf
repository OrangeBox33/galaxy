# Ставится в /etc/nginx/conf.d/galaxy.conf (контекст http).
# Свой VPN не ограничивается: запросы с пустым ключом nginx не считает.
map $remote_addr $galaxy_client {
    ~^10\.66\.66\.  "";
    default         $binary_remote_addr;
}

limit_req_zone  $galaxy_client zone=galaxy_static:10m rate=30r/s;
limit_req_zone  $galaxy_client zone=galaxy_api:10m    rate=10r/s;
limit_req_zone  $galaxy_client zone=galaxy_auth:1m    rate=1r/s;
# 20r/m — в среднем 10 входов за 30 с.
limit_req_zone  $galaxy_client zone=galaxy_auth30:1m  rate=20r/m;
limit_conn_zone $galaxy_client zone=galaxy_conn:10m;
