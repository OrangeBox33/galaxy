# Ставится в /etc/nginx/snippets/galaxy-proxy.conf, общее для всех location Galaxy.
#
# proxy_pass БЕЗ завершающего слеша — принципиально: так nginx передаёт исходный
# URI целиком, вместе с префиксом /galaxy, которого и ждёт Express. Со слешем
# (proxy_pass http://127.0.0.1:3005/;) префикс будет срезан, и все маршруты отдадут 404.
proxy_pass http://127.0.0.1:3005;
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Аватарки и бандл отдаёт Node; апстрим ставит свои заголовки кеширования сам.
proxy_buffering on;

# Вебхук Telegram может прислать до нескольких сотен килобайт.
client_max_body_size 2m;

limit_req_status  429;
limit_conn_status 429;
